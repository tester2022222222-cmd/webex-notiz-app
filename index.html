<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Notes 2026</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #090a0f;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #00f2fe;
      --secondary: #4facfe;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --glow: rgba(0, 242, 254, 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
      background-image: 
        radial-gradient(at 0% 0%, rgba(79, 172, 254, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(0, 242, 254, 0.1) 0px, transparent 50%);
    }

    .app-container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .header {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      padding: 20px 24px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-icon {
      width: 38px; height: 38px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: 10px; display: flex; align-items: center; justify-content: center;
      color: #000; font-weight: 800; font-size: 18px;
      box-shadow: 0 0 15px var(--glow);
    }

    .header h1 {
      font-size: 18px; font-weight: 700;
      background: linear-gradient(to right, #fff, var(--text-muted));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .status-pill {
      font-size: 12px; padding: 6px 14px; border-radius: 100px;
      background: rgba(16, 185, 129, 0.1); color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.2); font-weight: 600;
      display: flex; align-items: center; gap: 6px;
    }
    .status-dot {
      width: 6px; height: 6px; background-color: #10b981; border-radius: 50%;
      box-shadow: 0 0 8px #10b981; animation: pulse 2s infinite;
    }

    .card {
      background: var(--card-bg); backdrop-filter: blur(16px);
      border: 1px solid var(--card-border); padding: 28px; border-radius: 24px;
    }
    .card-title {
      font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px;
      color: var(--primary); font-weight: 800; margin-bottom: 12px;
    }

    textarea {
      width: 100%; height: 120px; padding: 16px; border: 1px solid var(--card-border);
      border-radius: 16px; font-size: 14px; outline: none; resize: none;
      background: rgba(0, 0, 0, 0.2); color: var(--text); margin-bottom: 16px;
    }
    textarea:focus { border-color: var(--primary); box-shadow: 0 0 20px var(--glow); }

    .btn {
      width: 100%; background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #000; border: none; padding: 14px 20px; font-size: 14px; font-weight: 700;
      border-radius: 14px; cursor: pointer; transition: transform 0.2s;
    }
    .btn:hover { transform: translateY(-2px); }

    .history { display: flex; flex-direction: column; gap: 10px; }
    .history-item {
      background: rgba(255, 255, 255, 0.02); padding: 14px 16px; border-radius: 12px;
      border: 1px solid var(--card-border); font-size: 13px; color: var(--text-muted);
    }

    /* ------------------------------------------------------------------- */
    /* LIVE CHAT BADGE & WIDGET UNTEN LINKS PLATZIEREN & BLINKEN LASSEN    */
    /* ------------------------------------------------------------------- */

    /* 1. Das Placetel Chat-Widget per CSS nach UNTEN LINKS verschieben */
    div[id*="placetel"], 
    iframe[id*="placetel"],
    #placetel-livechat-embed,
    .placetel-livechat-container {
      left: 20px !important;
      right: auto !important;
    }

    /* 2. Das pulsend/blinkende "Live Chat"-Schild unten links */
    .chat-live-badge {
      position: fixed;
      bottom: 24px;
      left: 24px;
      z-index: 999999;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 242, 254, 0.4);
      border-radius: 100px;
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 15px rgba(0, 242, 254, 0.25);
      transition: all 0.3s ease;
      animation: floatGlow 3s infinite alternate;
    }

    .chat-live-badge:hover {
      transform: scale(1.05) translateY(-2px);
      border-color: var(--primary);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6), 0 0 25px rgba(0, 242, 254, 0.5);
    }

    /* Der grün blinkende Online-Punkt */
    .live-dot {
      width: 10px;
      height: 10px;
      background-color: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 10px #10b981;
      animation: blink 1.5s infinite ease-in-out;
    }

    /* Blink- & Pulsier-Animationen */
    @keyframes blink {
      0% { opacity: 1; transform: scale(1); box-shadow: 0 0 10px #10b981; }
      50% { opacity: 0.3; transform: scale(0.85); box-shadow: 0 0 2px #10b981; }
      100% { opacity: 1; transform: scale(1); box-shadow: 0 0 10px #10b981; }
    }

    @keyframes floatGlow {
      0% { box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 10px rgba(0, 242, 254, 0.2); }
      100% { box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 22px rgba(0, 242, 254, 0.45); }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header class="header">
      <div class="brand">
        <div class="brand-icon">AI</div>
        <h1>Smart Notes 2026</h1>
      </div>
      <div class="status-pill">
        <div class="status-dot"></div>
        Live System
      </div>
    </header>

    <main class="card">
      <div class="card-title">Schnellnotiz erstellen</div>
      <textarea id="note-text" placeholder="Schreibe deine Gedanken oder Notizen hier..."></textarea>
      <button class="btn" onclick="saveNote()">Notiz speichern</button>
    </main>

    <section class="card">
      <div class="card-title">Letzte Einträge</div>
      <div id="history-list" class="history">
        <div class="history-item">Noch keine Notizen gespeichert.</div>
      </div>
    </section>
  </div>

  <!-- BLINKENDES UNTEN-LINKS CHAT-SCHILD -->
  <div class="chat-live-badge" onclick="triggerPlacetelChat()">
    <div class="live-dot"></div>
    <span>Live Chat • Online</span>
  </div>

  <script>
    function triggerPlacetelChat() {
      // Klick öffnet den echten Placetel Chat
      if (window.PlacetelLivechat && typeof window.PlacetelLivechat.open === 'function') {
        window.PlacetelLivechat.open();
      } else {
        // Fallback-Klick auf das Widget-Element
        const widgetEl = document.querySelector('iframe[id*="placetel"], div[id*="placetel"]');
        if (widgetEl) widgetEl.click();
      }
    }

    function saveNote() {
      const text = document.getElementById('note-text').value.trim();
      if (!text) return alert("Bitte Notiz eingeben.");
      let history = JSON.parse(localStorage.getItem('app_notes_2026') || '[]');
      history.unshift({ time: new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }), text });
      localStorage.setItem('app_notes_2026', JSON.stringify(history));
      document.getElementById('note-text').value = '';
      loadHistory();
    }

    function loadHistory() {
      const historyEl = document.getElementById('history-list');
      let history = JSON.parse(localStorage.getItem('app_notes_2026') || '[]');
      if (history.length === 0) return;
      historyEl.innerHTML = history.map(item => `<div class="history-item"><span>${item.text}</span> <small>${item.time}</small></div>`).join('');
    }

    loadHistory();
  </script>

  <!-- Placetel Livechat-Widget -->
  <script src="https://aipro.placetel.de/livechat/embed.js" data-widget-id="lcw_019ffebf-6b34-7140-8cc5-4b0dbd1277db" async></script>

</body>
</html>
