<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart AI Notes 2026</title>
  
  <!-- Inter Font für modernes Typo-Design -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #090a0f;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #00f2fe;
      --secondary: #4facfe;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --glow: rgba(0, 242, 254, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
      background-image: 
        radial-gradient(at 0% 0%, rgba(79, 172, 254, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(0, 242, 254, 0.1) 0px, transparent 50%);
    }

    /* Container Glow */
    .app-container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: relative;
    }

    /* Header Styling */
    .header {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      padding: 20px 24px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: 800;
      font-size: 18px;
      box-shadow: 0 0 15px var(--glow);
    }

    .header h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(to right, #fff, var(--text-muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-pill {
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 100px;
      background: rgba(16, 185, 129, 0.1);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.2);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background-color: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    /* Hero / Glass Card */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      padding: 28px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      transition: border-color 0.3s ease;
    }

    .card:hover {
      border-color: rgba(255, 255, 255, 0.15);
    }

    .card-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--primary);
      font-weight: 800;
      margin-bottom: 12px;
    }

    /* Input & Area Styling */
    textarea {
      width: 100%;
      height: 120px;
      padding: 16px;
      border: 1px solid var(--card-border);
      border-radius: 16px;
      font-size: 14px;
      outline: none;
      resize: none;
      background: rgba(0, 0, 0, 0.2);
      color: var(--text);
      transition: all 0.3s ease;
      margin-bottom: 16px;
    }

    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 20px var(--glow);
      background: rgba(0, 0, 0, 0.4);
    }

    /* Modern 2026 Button */
    .btn {
      width: 100%;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #000;
      border: none;
      padding: 14px 20px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 20px var(--glow);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(0, 242, 254, 0.3);
    }

    .btn:active {
      transform: translateY(0);
    }

    /* History List */
    .history {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 200px;
      overflow-y: auto;
    }

    .history-item {
      background: rgba(255, 255, 255, 0.02);
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-item span {
      color: var(--text);
    }

    .toast {
      font-size: 12px;
      color: #10b981;
      text-align: center;
      margin-top: 10px;
      display: none;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- Top Header Navigation -->
    <header class="header">
      <div class="brand">
        <div class="brand-icon">AI</div>
        <h1>Smart Notes 2026</h1>
      </div>
      <div class="status-pill">
        <div class="status-dot"></div>
        Live System
      </div>
    </header>

    <!-- Main Note Input -->
    <main class="card">
      <div class="card-title">Schnellnotiz erstellen</div>
      <textarea id="note-text" placeholder="Schreibe deine Gedanken oder Notizen hier..."></textarea>
      <button class="btn" onclick="saveNote()">Notiz speichern</button>
      <p id="toast" class="toast">✓ Notiz erfolgreich gesichert!</p>
    </main>

    <!-- History View -->
    <section class="card">
      <div class="card-title">Letzte Einträge</div>
      <div id="history-list" class="history">
        <div class="history-item">Noch keine Notizen vorhanden.</div>
      </div>
    </section>

  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      loadHistory();
    });

    function saveNote() {
      const text = document.getElementById('note-text').value.trim();
      if (!text) return alert("Bitte gebe eine Notiz ein.");

      const newEntry = {
        time: new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }),
        text: text
      };

      let history = JSON.parse(localStorage.getItem('app_notes_2026') || '[]');
      history.unshift(newEntry);
      if (history.length > 5) history.pop();

      localStorage.setItem('app_notes_2026', JSON.stringify(history));

      document.getElementById('note-text').value = '';
      showToast();
      loadHistory();
    }

    function loadHistory() {
      const historyEl = document.getElementById('history-list');
      let history = JSON.parse(localStorage.getItem('app_notes_2026') || '[]');

      if (history.length === 0) {
        historyEl.innerHTML = '<div class="history-item">Noch keine Notizen gespeichert.</div>';
        return;
      }

      historyEl.innerHTML = history.map(item => `
        <div class="history-item">
          <span>${escapeHtml(item.text)}</span>
          <small>${item.time}</small>
        </div>
      `).join('');
    }

    function showToast() {
      const toast = document.getElementById('toast');
      toast.style.display = 'block';
      setTimeout(() => toast.style.display = 'none', 2500);
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }
  </script>

  <!-- Placetel Livechat-Widget -->
  <script src="https://aipro.placetel.de/livechat/embed.js" data-widget-id="lcw_019ffebf-6b34-7140-8cc5-4b0dbd1277db" async></script>

</body>
</html>
