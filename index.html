<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Notes 2026</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #090a0f;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #00f2fe;
      --secondary: #4facfe;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --glow: rgba(0, 242, 254, 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
      background-image: 
        radial-gradient(at 0% 0%, rgba(79, 172, 254, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(0, 242, 254, 0.1) 0px, transparent 50%);
    }

    .app-container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .header {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      padding: 20px 24px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-icon {
      width: 38px; height: 38px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: 10px; display: flex; align-items: center; justify-content: center;
      color: #000; font-weight: 800; font-size: 18px;
      box-shadow: 0 0 15px var(--glow);
    }

    .header h1 {
      font-size: 18px; font-weight: 700;
      background: linear-gradient(to right, #fff, var(--text-muted));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .status-pill {
      font-size: 12px; padding: 6px 14px; border-radius: 100px;
      background: rgba(16, 185, 129, 0.1); color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.2); font-weight: 600;
      display: flex; align-items: center; gap: 6px;
    }
    .status-dot {
      width: 6px; height: 6px; background-color: #10b981; border-radius: 50%;
      box-shadow: 0 0 8px #10b981; animation: pulse 2s infinite;
    }

    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

    .card {
      background: var(--card-bg); backdrop-filter: blur(16px);
      border: 1px solid var(--card-border); padding: 28px; border-radius: 24px;
    }
    .card-title {
      font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px;
      color: var(--primary); font-weight: 800; margin-bottom: 12px;
    }

    textarea {
      width: 100%; height: 120px; padding: 16px; border: 1px solid var(--card-border);
      border-radius: 16px; font-size: 14px; outline: none; resize: none;
      background: rgba(0, 0, 0, 0.2); color: var(--text); margin-bottom: 16px;
    }
    textarea:focus { border-color: var(--primary); box-shadow: 0 0 20px var(--glow); }

    .btn {
      width: 100%; background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #000; border: none; padding: 14px 20px; font-size: 14px; font-weight: 700;
      border-radius: 14px; cursor: pointer; transition: transform 0.2s;
    }
    .btn:hover { transform: translateY(-2px); }

    .history { display: flex; flex-direction: column; gap: 10px; }
    .history-item {
      background: rgba(255, 255, 255, 0.02); padding: 14px 16px; border-radius: 12px;
      border: 1px solid var(--card-border); font-size: 13px; color: var(--text-muted);
    }

    /* ------------------------------------------------------------- */
    /* COOLER NEUER CHAT-BUTTON UNTEN LINKS 2026 STYLE               */
    /* ------------------------------------------------------------- */
    .custom-chat-trigger {
      position: fixed;
      bottom: 24px;
      left: 24px;
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 242, 254, 0.3);
      border-radius: 100px;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 242, 254, 0.2);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .custom-chat-trigger:hover {
      transform: translateY(-4px) scale(1.03);
      border-color: var(--primary);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 30px rgba(0, 242, 254, 0.4);
    }

    .custom-chat-avatar {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #000;
      position: relative;
    }

    .custom-chat-avatar::after {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 10px; height: 10px;
      background: #10b981;
      border: 2px solid #090a0f;
      border-radius: 50%;
    }

    .custom-chat-text {
      display: flex;
      flex-direction: column;
    }

    .custom-chat-title {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      line-height: 1.2;
    }

    .custom-chat-subtitle {
      font-size: 11px;
      color: var(--primary);
      font-weight: 500;
    }

    /* Das originale hässliche Placetel-Standard-Icon ausblenden */
    #placetel-livechat-button, 
    iframe[id*="placetel-livechat-button"] {
      opacity: 0 !important;
      pointer-events: none !important;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header class="header">
      <div class="brand">
        <div class="brand-icon">AI</div>
        <h1>Smart Notes 2026</h1>
      </div>
      <div class="status-pill">
        <div class="status-dot"></div>
        Live System
      </div>
    </header>

    <main class="card">
      <div class="card-title">Schnellnotiz erstellen</div>
      <textarea id="note-text" placeholder="Schreibe deine Gedanken oder Notizen hier..."></textarea>
      <button class="btn" onclick="saveNote()">Notiz speichern</button>
    </main>

    <section class="card">
      <div class="card-title">Letzte Einträge</div>
      <div id="history-list" class="history">
        <div class="history-item">Noch keine Notizen gespeichert.</div>
      </div>
    </section>
  </div>

  <!-- STYLISCHER CHAT-BUTTON UNTEN LINKS -->
  <div class="custom-chat-trigger" onclick="openPlacetelChat()">
    <div class="custom-chat-avatar">💬</div>
    <div class="custom-chat-text">
      <span class="custom-chat-title">AI Assistent</span>
      <span class="custom-chat-subtitle">Online • Jetzt chatten</span>
    </div>
  </div>

  <script>
    function openPlacetelChat() {
      // Öffnet das Placetel Chat-Fenster direkt beim Klick
      if (window.PlacetelLivechat && typeof window.PlacetelLivechat.open === 'function') {
        window.PlacetelLivechat.open();
      } else {
        // Fallback-Trigger falls das Widget anders geladen ist
        const widgetBtn = document.querySelector('[data-widget-id]');
        if (widgetBtn) widgetBtn.click();
      }
    }

    function saveNote() {
      const text = document.getElementById('note-text').value.trim();
      if (!text) return alert("Bitte Notiz eingeben.");
      let history = JSON.parse(localStorage.getItem('app_notes_2026') || '[]');
      history.unshift({ time: new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }), text });
      localStorage.setItem('app_notes_2026', JSON.stringify(history));
      document.getElementById('note-text').value = '';
      loadHistory();
    }

    function loadHistory() {
      const historyEl = document.getElementById('history-list');
      let history = JSON.parse(localStorage.getItem('app_notes_2026') || '[]');
      if (history.length === 0) return;
      historyEl.innerHTML = history.map(item => `<div class="history-item"><span>${item.text}</span> <small>${item.time}</small></div>`).join('');
    }

    loadHistory();
  </script>

  <!-- Placetel Livechat-Widget -->
  <script src="https://aipro.placetel.de/livechat/embed.js" data-widget-id="lcw_019ffebf-6b34-7140-8cc5-4b0dbd1277db" async></script>

</body>
</html>
